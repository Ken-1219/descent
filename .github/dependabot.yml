# Dependabot configuration to update npm packages weekly
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of your package.json and package-lock.json
    schedule:
      interval: "cron"
      cronjob: "0 17 * * 1,2" # At 5pm on Monday and Tuesday - https://crontab.guru/
      timezone: "America/New_York"
    # Phase 11k: versions are pinned until submission (CLAUDE.md), so no version-update PRs; security updates still open.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      exclude:
        - "devvit"
        - "@devvit/*"
    groups:
      devvit:
        patterns:
          - "devvit"
          - "@devvit/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
