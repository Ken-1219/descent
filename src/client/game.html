<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <link rel="preload" href="./assets/fonts/jacquard-24.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/pixelify-sans.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The atlas would otherwise start only after game.js runs: preloading overlaps it with the script download. -->
    <link rel="preload" href="./assets/atlas.png" as="image" />
    <link rel="stylesheet" href="style.css" />
    <title>Descent</title>
  </head>
  <body>
    <!-- Phase 11 (A64): the loading flame, drawn by CSS before any script runs; removed when the scene is ready. -->
    <div class="boot" id="boot" role="status"><div class="boot__flame" aria-hidden="true"></div><p class="boot__text">Lighting the torch…</p><p class="boot__slow">Still dark? Close the game and open it again.</p></div>
    <div class="play">
      <header class="hud" id="hud"></header>
      <main class="stage" id="stage" aria-label="Dungeon">
        <div id="game-container"></div>
        <p class="carving" id="carving" aria-live="polite" hidden></p>
      </main>
      <div class="controls" id="controls"></div>
    </div>
    <div class="end" id="end" hidden></div>
    <div class="card" id="card" hidden></div>
    <script type="module" src="game.ts"></script>
  </body>
</html>
