<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <link rel="preload" href="./assets/fonts/jacquard-24.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/pixelify-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <title>Descent</title>
  </head>
  <body class="splash">
    <main class="splash__card" id="card">
      <h1 class="title splash__name">Descent</h1>
      <p class="splash__what muted">A daily dungeon: one run a day, and today's deaths build tomorrow's floor.</p>
      <p class="splash__floor" id="floor" data-fit>&nbsp;</p>
      <p class="splash__fname" id="fname"></p>
      <p class="splash__line" id="line" data-fit>Opening today's floor…</p>
      <div class="splash__view" id="view" aria-hidden="true"></div>
      <button class="btn btn--primary splash__go" id="go" type="button" disabled>Descend</button>
      <p class="splash__foot muted"><span id="when"></span> · <span id="by"></span> · <button class="splash__privacy" id="privacy" type="button">Privacy</button></p>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
